<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>FUCKPUMPFUN Logo 2 - Broken Chart</title>
<style>
  body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
</style>
</head>
<body>
<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-big">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="pump" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff88"/>
      <stop offset="100%" style="stop-color:#00ff88"/>
    </linearGradient>
    <linearGradient id="dump" x1="50%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f85149"/>
      <stop offset="100%" style="stop-color:#f85149"/>
    </linearGradient>
    <clipPath id="chart-area">
      <rect x="100" y="150" width="600" height="350"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="#0d1117"/>

  <!-- Grid lines -->
  <g opacity="0.1" stroke="#fff" stroke-width="0.5">
    <line x1="100" y1="200" x2="700" y2="200"/>
    <line x1="100" y1="250" x2="700" y2="250"/>
    <line x1="100" y1="300" x2="700" y2="300"/>
    <line x1="100" y1="350" x2="700" y2="350"/>
    <line x1="100" y1="400" x2="700" y2="400"/>
    <line x1="100" y1="450" x2="700" y2="450"/>
    <line x1="200" y1="150" x2="200" y2="500"/>
    <line x1="300" y1="150" x2="300" y2="500"/>
    <line x1="400" y1="150" x2="400" y2="500"/>
    <line x1="500" y1="150" x2="500" y2="500"/>
    <line x1="600" y1="150" x2="600" y2="500"/>
  </g>

  <!-- Bonding curve - pump up -->
  <g filter="url(#glow)" clip-path="url(#chart-area)">
    <path d="M120 480 Q200 470 250 440 Q300 400 330 350 Q360 280 380 240 Q400 200 420 180"
          fill="none" stroke="#00ff88" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- The break point - explosion -->
  <g filter="url(#glow-big)">
    <circle cx="420" cy="180" r="15" fill="#00ff88" opacity="0.3"/>
    <circle cx="420" cy="180" r="8" fill="#00ff88" opacity="0.5"/>
    <circle cx="420" cy="180" r="3" fill="#fff"/>
  </g>

  <!-- Crack lines from break point -->
  <g stroke="#f85149" stroke-width="1.5" opacity="0.6" filter="url(#glow)">
    <line x1="420" y1="180" x2="440" y2="160"/>
    <line x1="440" y1="160" x2="455" y2="165"/>
    <line x1="420" y1="180" x2="410" y2="155"/>
    <line x1="410" y1="155" x2="415" y2="140"/>
    <line x1="420" y1="180" x2="445" y2="175"/>
    <line x1="445" y1="175" x2="460" y2="155"/>
  </g>

  <!-- Dump down -->
  <g filter="url(#glow)" clip-path="url(#chart-area)">
    <path d="M420 180 Q440 200 460 280 Q480 360 520 420 Q560 460 620 475 Q660 480 700 482"
          fill="none" stroke="#f85149" stroke-width="3.5" stroke-linecap="round"
          stroke-dasharray="8,4"/>
  </g>

  <!-- Falling particles -->
  <g fill="#f85149" opacity="0.4">
    <rect x="450" y="220" width="4" height="4" transform="rotate(30 452 222)"/>
    <rect x="480" y="300" width="3" height="3" transform="rotate(45 481 301)"/>
    <rect x="430" y="250" width="5" height="5" transform="rotate(15 432 252)"/>
    <rect x="500" y="350" width="3" height="3" transform="rotate(60 501 351)"/>
    <rect x="460" y="310" width="4" height="4" transform="rotate(20 462 312)"/>
  </g>

  <!-- Price labels -->
  <text x="85" y="185" text-anchor="end" font-family="monospace" font-size="11" fill="#8b949e">ATH</text>
  <text x="85" y="485" text-anchor="end" font-family="monospace" font-size="11" fill="#8b949e">0</text>

  <!-- Chart frame -->
  <line x1="100" y1="150" x2="100" y2="500" stroke="#1a2332" stroke-width="2"/>
  <line x1="100" y1="500" x2="700" y2="500" stroke="#1a2332" stroke-width="2"/>

  <!-- Annotation -->
  <g>
    <line x1="420" y1="515" x2="420" y2="530" stroke="#8b949e" stroke-width="1"/>
    <text x="420" y="545" text-anchor="middle" font-family="monospace" font-size="11" fill="#f85149">rug pulled</text>
  </g>

  <!-- Scanner crosshair on the break -->
  <circle cx="420" cy="180" r="30" fill="none" stroke="#00ff88" stroke-width="1" opacity="0.3" stroke-dasharray="4,4">
    <animateTransform attributeName="transform" type="rotate" from="0 420 180" to="360 420 180" dur="10s" repeatCount="indefinite"/>
  </circle>
  <line x1="420" y1="145" x2="420" y2="155" stroke="#00ff88" stroke-width="1" opacity="0.5"/>
  <line x1="420" y1="205" x2="420" y2="215" stroke="#00ff88" stroke-width="1" opacity="0.5"/>
  <line x1="385" y1="180" x2="395" y2="180" stroke="#00ff88" stroke-width="1" opacity="0.5"/>
  <line x1="445" y1="180" x2="455" y2="180" stroke="#00ff88" stroke-width="1" opacity="0.5"/>

  <!-- Main text -->
  <g filter="url(#glow-big)">
    <text x="400" y="620" text-anchor="middle" font-family="'Courier New', monospace" font-size="58" font-weight="bold" fill="#00ff88" letter-spacing="3">FUCKPUMPFUN</text>
  </g>

  <!-- Subtitle -->
  <text x="400" y="660" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" fill="#8b949e" letter-spacing="6">BOTS EXPOSED</text>

  <!-- Bottom decorative -->
  <g opacity="0.4">
    <text x="400" y="720" text-anchor="middle" font-family="monospace" font-size="11" fill="#00ff88">
      &lt; 666 wallets analyzed / 7 strategies decoded / V3 reverse-engineered &gt;
    </text>
  </g>
</svg>
</body>
</html>
