<svg width="900" height="520" viewBox="0 0 900 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="900" y2="520">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </linearGradient>
  </defs>

  <rect width="900" height="520" fill="url(#bg2)" rx="12"/>

  <!-- Header -->
  <text x="45" y="45" font-family="ui-monospace,monospace" font-size="10" fill="#00ff88" letter-spacing="2">ARSENAL</text>
  <text x="45" y="72" font-family="ui-monospace,monospace" font-size="24" font-weight="bold" fill="#e6edf3">7 bots. One shared library. Zero paid APIs.</text>

  <!-- Architecture ASCII -->
  <g font-family="ui-monospace,monospace" font-size="11" fill="#8b949e">
    <text x="350" y="115">         ┌─── YOU ───┐</text>
    <text x="350" y="130">         │           │</text>
    <text x="350" y="145">    lib/ (7 modules)  </text>
    <text x="350" y="160">         │           │</text>
    <text x="350" y="175">    ┌──┬──┬──┬──┬──┬──┐</text>
  </g>

  <!-- Bot cards - Row 1 -->
  <!-- Sniper -->
  <rect x="45" y="200" width="250" height="130" rx="8" fill="#161b22" stroke="#f8514930" stroke-width="1"/>
  <rect x="45" y="200" width="250" height="3" rx="1" fill="#f85149"/>
  <text x="60" y="228" font-family="ui-monospace,monospace" font-size="10" fill="#f85149" letter-spacing="1">LEVEL 3</text>
  <text x="60" y="250" font-family="ui-monospace,monospace" font-size="18" font-weight="bold" fill="#e6edf3">Sniper Bot</text>
  <text x="60" y="272" font-family="ui-monospace,monospace" font-size="11" fill="#8b949e">Auto-buy new tokens on create.</text>
  <text x="60" y="288" font-family="ui-monospace,monospace" font-size="11" fill="#8b949e">TP/SL/timeout exit strategy.</text>
  <text x="60" y="310" font-family="ui-monospace,monospace" font-size="11" fill="#00ff88">+88.2% in 3s (dry-run)</text>

  <!-- Copy Trader -->
  <rect x="325" y="200" width="250" height="130" rx="8" fill="#161b22" stroke="#7c3aed30" stroke-width="1"/>
  <rect x="325" y="200" width="250" height="3" rx="1" fill="#7c3aed"/>
  <text x="340" y="228" font-family="ui-monospace,monospace" font-size="10" fill="#7c3aed" letter-spacing="1">LEVEL 4</text>
  <text x="340" y="250" font-family="ui-monospace,monospace" font-size="18" font-weight="bold" fill="#e6edf3">Copy Trader</text>
  <text x="340" y="272" font-family="ui-monospace,monospace" font-size="11" fill="#8b949e">Mirror top wallet trades.</text>
  <text x="340" y="288" font-family="ui-monospace,monospace" font-size="11" fill="#8b949e">1-2s latency. Per-wallet sub.</text>
  <text x="340" y="310" font-family="ui-monospace,monospace" font-size="11" fill="#00ff88">80% WR targets identified</text>

  <!-- Graduation Sniper -->
  <rect x="605" y="200" width="250" height="130" rx="8" fill="#161b22" stroke="#e3b34130" stroke-width="1"/>
  <rect x="605" y="200" width="250" height="3" rx="1" fill="#e3b341"/>
  <text x="620" y="228" font-family="ui-monospace,monospace" font-size="10" fill="#e3b341" letter-spacing="1">LEVEL 7</text>
  <text x="620" y="250" font-family="ui-monospace,monospace" font-size="18" font-weight="bold" fill="#e6edf3">Graduation Sniper</text>
  <text x="620" y="272" font-family="ui-monospace,monospace" font-size="11" fill="#8b949e">Buy before PumpSwap migration.</text>
  <text x="620" y="288" font-family="ui-monospace,monospace" font-size="11" fill="#8b949e">Reads reserves from event data.</text>
  <text x="620" y="310" font-family="ui-monospace,monospace" font-size="11" fill="#00ff88">0 extra RPC calls needed</text>

  <!-- Bot cards - Row 2 -->
  <!-- Monitor -->
  <rect x="45" y="355" width="190" height="120" rx="8" fill="#161b22" stroke="#1a2332" stroke-width="1"/>
  <text x="60" y="380" font-family="ui-monospace,monospace" font-size="10" fill="#58a6ff" letter-spacing="1">MONITOR</text>
  <text x="60" y="400" font-family="ui-monospace,monospace" font-size="14" font-weight="bold" fill="#e6edf3">Token Stream</text>
  <text x="60" y="420" font-family="ui-monospace,monospace" font-size="11" fill="#8b949e">Real-time WebSocket</text>
  <text x="60" y="436" font-family="ui-monospace,monospace" font-size="11" fill="#8b949e">195 creates / 30s</text>
  <text x="60" y="460" font-family="ui-monospace,monospace" font-size="10" fill="#58a6ff">LEVEL 2</text>

  <!-- Analytics -->
  <rect x="255" y="355" width="190" height="120" rx="8" fill="#161b22" stroke="#1a2332" stroke-width="1"/>
  <text x="270" y="380" font-family="ui-monospace,monospace" font-size="10" fill="#00d4ff" letter-spacing="1">DASHBOARD</text>
  <text x="270" y="400" font-family="ui-monospace,monospace" font-size="14" font-weight="bold" fill="#e6edf3">Analytics</text>
  <text x="270" y="420" font-family="ui-monospace,monospace" font-size="11" fill="#8b949e">Live web dashboard</text>
  <text x="270" y="436" font-family="ui-monospace,monospace" font-size="11" fill="#8b949e">localhost:3000</text>
  <text x="270" y="460" font-family="ui-monospace,monospace" font-size="10" fill="#00d4ff">LEVEL 5</text>

  <!-- Volume Analyzer -->
  <rect x="465" y="355" width="190" height="120" rx="8" fill="#161b22" stroke="#1a2332" stroke-width="1"/>
  <text x="480" y="380" font-family="ui-monospace,monospace" font-size="10" fill="#00ff88" letter-spacing="1">INTEL</text>
  <text x="480" y="400" font-family="ui-monospace,monospace" font-size="14" font-weight="bold" fill="#e6edf3">Vol. Analyzer</text>
  <text x="480" y="420" font-family="ui-monospace,monospace" font-size="11" fill="#8b949e">Wallet X-ray</text>
  <text x="480" y="436" font-family="ui-monospace,monospace" font-size="11" fill="#8b949e">7 strategy types</text>
  <text x="480" y="460" font-family="ui-monospace,monospace" font-size="10" fill="#00ff88">LEVEL 6</text>

  <!-- Basic Trader -->
  <rect x="675" y="355" width="190" height="120" rx="8" fill="#161b22" stroke="#1a2332" stroke-width="1"/>
  <text x="690" y="380" font-family="ui-monospace,monospace" font-size="10" fill="#8b949e" letter-spacing="1">CLI</text>
  <text x="690" y="400" font-family="ui-monospace,monospace" font-size="14" font-weight="bold" fill="#e6edf3">Basic Trader</text>
  <text x="690" y="420" font-family="ui-monospace,monospace" font-size="11" fill="#8b949e">Buy / Sell / Price</text>
  <text x="690" y="436" font-family="ui-monospace,monospace" font-size="11" fill="#8b949e">Foundation module</text>
  <text x="690" y="460" font-family="ui-monospace,monospace" font-size="10" fill="#8b949e">LEVEL 1</text>

  <!-- Bottom -->
  <text x="450" y="505" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#1a2332" letter-spacing="2">ALL BOTS SUPPORT --dry-run FOR PAPER TRADING</text>
</svg>
