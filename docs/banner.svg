    <text x="620" y="86">    ██▓▓▓▓▓▓▓▓██    </text>
    <text x="620" y="97">   █▓▓▓▓▓▓▓▓▓▓▓▓█   </text>
    <text x="620" y="108">  █▓▓▓▓▓▓▓▓▓▓▓▓▓▓█  </text>
    <text x="620" y="119">  █▓███▓▓▓▓▓▓███▓█  </text>
    <text x="620" y="130">  █▓█◉█▓▓▓▓▓█◉█▓█  </text>
    <text x="620" y="141">  █▓███▓▓▓▓▓███▓▓█  </text>
    <text x="620" y="152">   █▓▓▓▓▓▄▓▓▓▓▓█   </text>
    <text x="620" y="163">   █▓▓▓▓▓▓▓▓▓▓▓█   </text>
    <text x="620" y="174">    █▓▓▓━━━▓▓▓█    </text>
    <text x="620" y="185">  ██████████████████  </text>
    <text x="620" y="196">  █ COOL STORY BABE █</text>
    <text x="620" y="207">  █  ░░░░░░░░░░░░  █</text>
